# Juniper MX + QFX10k variant (Express silicon) — chassis /components telemetry.
#
# Selection is by probe model: QFX10* (four-corner validated on prod site A @ 23.4R2:
# QFX10002-72Q). MX* is included for MX chassis but is OUT OF SCOPE / unvalidated — no MX
# in prod, and on MX the marketing model is
# on the CHASSIS component, not the routing engine, so the probe's RE-derived
# model will need a chassis fallback before MX selection is trustworthy.
#
# Subscription paths are verbatim from the production gnmic ingestor
# (juniper-core-spine-sub-stats @15s; juniper-sub-interfaces @2m;
# juniper-core-sub-comms @2m). This variant covers the core and spine roles:
# BGP runs everywhere (default on); ISIS is core-only (default off, force-on the
# cores per device).
key: juniper-mx
vendor: juniper
platform_match:
  model: ["MX*", "QFX10*"]
default_port: 57400
encoding: proto
platform_hints: ["juniper_mx", "juniper_qfx10k"]

modules:
  processors:
    processors: [cpu-rename, cpu-convert, cpu-keep]
    metrics:
      cpu_utilization:
        type: numeric
        federate: true
        yang: oc-cpu-utilization-instant
    paths:
      - key: cpu
        path: /components/component/cpu/utilization
        mode: sample
        sample_interval: 15s
        yang: oc-cpu-utilization-instant
        description: "Control-card / RE CPU utilisation"

  mempools:
    processors: [memory-rename, memory-convert, memory-keep]
    metrics:
      memory_total_bytes:
        type: numeric
        federate: true
        yang: oc-component-memory-available
      memory_used_bytes:
        type: numeric
        federate: true
        yang: oc-component-memory-utilized
    paths:
      - key: mem-controller-card
        path: /components/component/state[type=CONTROLLER_CARD]/memory
        mode: sample
        sample_interval: 15s
        description: "Controller-card memory"
      - key: mem-linecard
        path: /components/component/state[type=LINECARD]/memory
        mode: sample
        sample_interval: 15s
        description: "Line-card memory"

  sensors:
    processors: [sensors-state, sensors-keep]
    metrics:
      power_supply_state:
        type: state
        federate: true
        yang: oc-component-oper-status
        required_labels:
          - oper_state
        map:
          ACTIVE: 1
          INACTIVE: 0
          DISABLED: -1
    paths:
      - key: psu
        path: /components/component/state[type=POWER_SUPPLY]
        mode: sample
        sample_interval: 15s
        yang: oc-component-oper-status
        description: "Power-supply component state"

  environment:
    processors: [environment-temp-rename, environment-convert, environment-keep]
    metrics:
      temperature_celsius:
        type: numeric
        federate: true
        yang: oc-component-temperature-instant
    # No fan: Junos 23.4R2 does not implement openconfig-platform-fan (the device rejects
    # /components/component/fan/state/speed as an invalid subscription path).
    paths:
      - key: component-temp
        path: /components/component/state/temperature/instant
        mode: sample
        sample_interval: 60s
        description: "Component temperature (OpenConfig)"

  ports:
    processors: [gnpctl-meta]
    paths:
      - key: intf-admin-status
        path: /interfaces/interface/state/admin-status
        mode: sample
        sample_interval: 2m
        description: "Interface admin status"
      - key: intf-description
        path: /interfaces/interface/state/description
        mode: sample
        sample_interval: 2m
        description: "Interface description"
      - key: intf-oper-status
        path: /interfaces/interface/state/oper-status
        mode: sample
        sample_interval: 2m
        description: "Interface operational status"
      - key: intf-counters
        path: /interfaces/interface/state/counters
        mode: sample
        sample_interval: 2m
        description: "Interface counters"
      - key: subintf-counters
        path: /interfaces/interface/subinterfaces/subinterface/state/counters
        mode: sample
        sample_interval: 2m
        description: "Subinterface counters"

  transceivers:
    processors: [transceiver-rename, transceiver-convert, transceiver-keep]
    metrics:
      transceiver_input_power_dbm:
        type: numeric
        federate: true
        yang: oc-xcvr-input-power-instant
      transceiver_output_power_dbm:
        type: numeric
        federate: true
        yang: oc-xcvr-output-power-instant
      transceiver_laser_bias_ma:
        type: numeric
        federate: true
        yang: oc-xcvr-laser-bias-instant
    paths:
      - key: xcvr-channel
        path: /components/component/transceiver/physical-channels/channel/state
        mode: sample
        sample_interval: 2m
        description: "Transceiver per-channel state"

  bgp-peers:
    default: on  # BGP runs across this fabric
    processors: [bgp-info, bgp-fsm, bgp-fsm-convert, bgp-rename, bgp-keep-state]
    metrics:
      bgp_neighbor_session_state:
        type: state
        federate: true
        yang: oc-bgp-neighbor-session-state
        map:
          IDLE: 1
          CONNECT: 2
          ACTIVE: 3
          OPENSENT: 4
          OPENCONFIRM: 5
          ESTABLISHED: 6
      bgp_neighbor_peer_group:
        type: info
        federate: true
        required_labels:
          - peer_group
      bgp_neighbor_description:
        type: info
        federate: true
        required_labels:
          - description
    paths:
      - key: bgp-session-state
        path: /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state
        mode: sample
        sample_interval: 2m
        description: "BGP neighbor session state"
      - key: bgp-last-established
        path: /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/last-established
        mode: sample
        sample_interval: 2m
        description: "BGP neighbor last-established"
      - key: bgp-description
        path: /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/description
        mode: sample
        sample_interval: 2m
        description: "BGP neighbor description"
      - key: bgp-peer-group
        path: /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-group
        mode: sample
        sample_interval: 2m
        description: "BGP neighbor peer-group"

  isis:
    processors: [isis-fsm, isis-fsm-convert, isis-rename, isis-keep-state]
    metrics:
      isis_adjacency_state:
        type: state
        federate: true
        optional: true  # IS-IS is core-only — absent on roles that don't run it
        yang: oc-isis-adjacency-state
        map:
          UP: 3
          INIT: 2
          DOWN: 1
          FAILED: 0
    paths:  # core-only in the ingestor; default off, force-on the cores per device
      - key: isis-adjacency-state
        path: /network-instances/network-instance/protocols/protocol/isis/interfaces/interface/levels/level/adjacencies/adjacency/state/adjacency-state
        mode: sample
        sample_interval: 2m
        description: "ISIS adjacency state"
      - key: isis-up-timestamp
        path: /network-instances/network-instance/protocols/protocol/isis/interfaces/interface/levels/level/adjacencies/adjacency/state/up-timestamp
        mode: sample
        sample_interval: 2m
        description: "ISIS adjacency up-timestamp"
